<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Télécommande · Poker Academy</title>
<style>
@font-face{font-family:'Big Shoulders Display';font-weight:800;src:url(fonts/big-shoulders-display-latin-800-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'IBM Plex Sans';font-weight:400;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:'IBM Plex Sans';font-weight:600;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format('woff2');font-display:swap}
:root{--bg:#0b0b0d;--panel:#17171b;--panel2:#1f1f25;--line:#2e2e35;--ink:#fff;--muted:#b9b9c0;--gold:#ffd23f;--red:#e0464c;--green:#3ddc84}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,-apple-system,Roboto,sans-serif;font-size:17px;-webkit-tap-highlight-color:transparent}
.disp{font-family:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.03em}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
header .disp{color:var(--gold);letter-spacing:.18em;font-size:15px}
#dot{font-size:13px;color:var(--muted)}
.hero{background:radial-gradient(ellipse at 50% 0%,#2a2210,#141416 70%);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}
.lvl{color:var(--muted);letter-spacing:.12em;font-size:16px}
.bl{font-size:46px;color:var(--gold);line-height:1}
.ante{color:#ddd;min-height:1.2em}
.clock{font-size:84px;line-height:1;font-variant-numeric:tabular-nums}
.clock.hot{color:var(--red)}
.next{color:var(--muted);font-size:14px}
.badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.badges span{border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:2px 10px;font-size:13px}
.badges span.off{border-color:var(--red);color:#ff8a8f}
.ctrl{display:grid;grid-template-columns:1fr 1fr 2fr 1fr 1fr;gap:8px;margin-top:12px}
button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:12px;min-height:50px;cursor:pointer}
button:active{transform:scale(.97)}
.gold{background:var(--gold);color:#111;border-color:var(--gold);font-weight:700}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.stats div{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:12px;padding:8px;text-align:center}
.stats span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stats b{font-size:26px}
.stats small{color:var(--gold);font-size:12px}
.msg{background:var(--panel);border-left:4px solid var(--gold);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:10px}
.moves{background:var(--gold);color:#111;border-radius:14px;padding:12px;margin-bottom:12px}
.moves b{display:block;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.moves div{padding:3px 0;border-bottom:1px solid rgba(0,0,0,.15)}
.moves button{width:100%;margin-top:8px;background:#111;color:var(--gold);border:0;font-weight:700}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--panel);border-radius:14px;padding:5px;margin-bottom:10px}
.tabs button{border:0;background:none;min-height:42px}
.tabs .on{background:var(--gold);color:#111;font-weight:700}
input{width:100%;font:inherit;background:var(--panel2);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px;margin-bottom:10px}
.table{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 10px;margin-bottom:10px}
.table h3{margin:4px 0 6px;font-size:18px;color:var(--gold)}
.pl{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.pl i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);flex:0 0 30px}
.pl span{flex:1;min-width:0}
.pl small{display:block;color:var(--muted);font-size:12px}
.pl button{min-height:42px;padding:0 14px}
.out{background:#2a1214;border-color:#5a2226;color:#ffb3b5}
.wanted{color:#ff8a8f}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:#141416;border-top:3px solid var(--gold);border-radius:18px 18px 0 0;padding:14px 14px 28px;max-height:80vh;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.grid button.sel{background:var(--gold);color:#111;font-weight:700}
.muted{color:var(--muted)}
.code{max-width:340px;margin:18vh auto 0;text-align:center}
.code input{text-align:center;font-size:36px;letter-spacing:.4em}
.win{background:linear-gradient(135deg,#3a2c06,#141416);border:2px solid var(--gold);border-radius:16px;padding:14px;text-align:center;margin-bottom:12px}
.win b{display:block;font-size:30px;color:var(--gold)}
.win button{width:100%;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  'use strict';
  var S = null, rcv = 0, code = '', TAB = 'tables', KO = null, BY = '', Q = '', fails = 0, lastOk = 0, busy = false;
  try { code = (location.search.match(/[?&]c=(\d{4,6})/) || [])[1] || localStorage.getItem('paRemoteCode') || ''; } catch (e) {}
  var app = document.getElementById('app');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function mmss(s) { s = Math.max(0, Math.ceil(s)); var m = Math.floor(s / 60); return (m < 10 ? '0' : '') + m + ':' + ((s % 60) < 10 ? '0' : '') + (s % 60); }
  function rem() { return S ? (S.run ? S.rem - (Date.now() - rcv) / 1000 : S.rem) : 0; }
  function send(c) {
    if (busy) return; busy = true;
    fetch('/live/cmd?c=' + code, { method: 'POST', body: JSON.stringify(c) }).then(function () { busy = false; setTimeout(poll, 400); setTimeout(poll, 1300); }).catch(function () { busy = false; });
    if (navigator.vibrate) try { navigator.vibrate(25); } catch (e) {}
  }
  function poll() {
    if (!code) return;
    fetch('/live/state?c=' + code, { cache: 'no-store' }).then(function (r) {
      if (r.status === 403) { code = ''; try { localStorage.removeItem('paRemoteCode'); } catch (e) {} render(); throw 0; }
      if (!r.ok) throw 0; return r.json();
    }).then(function (j) { try { localStorage.setItem('paRemoteCode', code); } catch (e) {} fails = 0; lastOk = Date.now(); if (j && j.at) { S = j; rcv = Date.now(); } render(); }).catch(function () { fails++; dot(); });
  }
  function dot() { var d = document.getElementById('dot'); if (d) d.innerHTML = Date.now() - lastOk < 4000 ? '<span style="color:var(--green)">● relié au PC</span>' : '<span style="color:#ff8a8f">● PC injoignable</span>'; }
  function codeView() {
    app.innerHTML = '<div class="code"><div class="disp" style="color:var(--gold);letter-spacing:.2em">POKER ACADEMY</div><h1 class="disp" style="font-size:40px;margin:8px 0">Télécommande</h1><p class="muted">Entre le code affiché sur le PC (Tournoi › Réglages › Télécommande).</p><input id="cd" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="0000"><button class="gold" style="width:100%" data-a="code">Valider</button></div>';
    setTimeout(function () { var i = document.getElementById('cd'); if (i) i.focus(); }, 50);
  }
  function render() {
    if (!code) { codeView(); return; }
    if (!S) { app.innerHTML = '<div class="code"><p class="muted">Connexion au PC…</p></div>'; return; }
    var ae = document.activeElement, keepQ = ae && ae.id === 'q', pos = keepQ ? ae.selectionStart : 0, y = window.scrollY;
    var h = '<div class="wrap"><header><span class="disp">POKER ACADEMY</span><span id="dot"></span></header>';
    h += '<div class="hero"><div class="disp lvl">' + esc(S.name) + ' · ' + esc(S.lvl) + '</div><div class="disp bl">' + esc(S.bl) + '</div><div class="ante">' + (esc(S.ante) || '&nbsp;') + '</div><div class="disp clock" id="clk">' + mmss(rem()) + '</div><div class="next">' + esc(S.next) + '</div>' +
      (S.badges && S.badges.length ? '<div class="badges">' + S.badges.map(function (b) { return '<span class="' + (/fermées/.test(b) ? 'off' : '') + '">' + esc(b) + '</span>'; }).join('') + '</div>' : '') +
      '<div class="ctrl"><button data-a="prev">⏮</button><button data-a="minus">−1</button><button class="gold" data-a="toggle">' + (S.run ? '❚❚ Pause' : '▶ Lancer') + '</button><button data-a="plus">+1</button><button data-a="next">⏭</button></div></div>';
    h += '<div class="stats"><div><span>Joueurs</span><b>' + S.left + '</b><small>sur ' + S.total + '</small></div><div><span>Tapis moyen</span><b style="font-size:20px">' + (esc(S.avg) || '—') + '</b><small>' + (S.avgBB ? S.avgBB + ' BB' : '') + '</small></div><div><span>Voix</span><button data-a="voice" style="min-height:36px;width:100%;margin-top:4px">' + (S.voice ? '🔊 oui' : '🔇 non') + '</button></div></div>';
    if (S.prize) h += '<div class="msg">🎁 ' + esc(S.prize) + '</div>';
    if (S.holder) h += '<div class="msg wanted">🎯 Tête mise à prix : <b>' + esc(S.holder) + '</b></div>';
    if (S.msg) h += '<div class="msg">' + esc(S.msg) + '</div>';
    if (S.win) h += '<div class="win">🏆<b>' + esc(S.win) + '</b>gagne le tournoi' + (S.canLeague ? (S.saved ? '<div class="muted">Enregistré au classement.</div>' : '<button class="gold" data-a="saveLeague">Enregistrer au classement</button>') : '') + '</div>';
    if (S.pend && S.pend.length) h += '<div class="moves"><b>Changements de place · ' + S.pend.length + '</b>' + S.pend.map(function (m) { return '<div><strong>' + esc(m.n) + '</strong> : ' + (m.ft ? 'T' + m.ft + '·S' + m.fs + ' → ' : '') + 'table ' + m.tt + ', siège ' + m.ts + '</div>'; }).join('') + '<button data-a="movesDone">C’est fait ✓</button></div>';
    var alive = S.players.filter(function (p) { return !p.o; }), outs = S.players.filter(function (p) { return p.o; }).sort(function (a, b) { return a.p - b.p; });
    h += '<div class="tabs"><button class="' + (TAB === 'tables' ? 'on' : '') + '" data-a="tab" data-v="tables">En jeu · ' + alive.length + '</button><button class="' + (TAB === 'out' ? 'on' : '') + '" data-a="tab" data-v="out">Éliminés · ' + outs.length + '</button></div>';
    if (TAB === 'tables') {
      h += '<input id="q" type="search" placeholder="Trouver un joueur…" value="' + esc(Q) + '" autocomplete="off">';
      var qn = Q.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''), show = alive.filter(function (p) { return !qn || p.n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').indexOf(qn) >= 0; });
      if (!S.drawn) h += '<div class="msg">Les tables ne sont pas encore tirées (sur le PC : Tournoi › Tables).</div>';
      var tb = {}; show.forEach(function (p) { (tb[p.t] = tb[p.t] || []).push(p); });
      Object.keys(tb).map(Number).sort(function (a, b) { return a - b; }).forEach(function (t) {
        h += '<div class="table"><h3 class="disp">' + (t ? 'Table ' + t : 'Pas encore placés') + '</h3>' + tb[t].sort(function (a, b) { return a.s - b.s; }).map(function (p) {
          return '<div class="pl"><i>' + (p.s || '·') + '</i><span><b' + (S.holder && p.n.toLowerCase() === S.holder.toLowerCase() ? ' class="wanted"' : '') + '>' + esc(p.n) + '</b>' + (p.e > 1 ? '<small>' + p.e + ' entrées</small>' : '') + '</span>' + (S.drawn ? '<button class="out" data-a="ko" data-v="' + p.i + '">Sorti</button>' : '') + '</div>';
        }).join('') + '</div>';
      });
    } else {
      h += outs.length ? '<div class="table">' + outs.map(function (p) { return '<div class="pl"><i>' + p.p + '</i><span><b>' + esc(p.n) + '</b><small>' + (p.by ? 'par ' + esc(p.by) : '') + '</small></span><button data-a="reentry" data-v="' + p.i + '">Re-entry</button><button data-a="unko" data-v="' + p.i + '" aria-label="Annuler">↺</button></div>'; }).join('') + '</div><button style="width:100%" data-a="addPlus">+1 add-on</button>' : '<div class="msg">Personne n’est encore sorti.</div>';
    }
    h += '</div>';
    if (KO !== null) {
      var pk = S.players[KO]; if (!pk || pk.o) KO = null; else {
        var same = alive.filter(function (p) { return p.t === pk.t && p.i !== pk.i; }), others = alive.filter(function (p) { return p.t !== pk.t; });
        var b = function (p) { return '<button class="' + (String(BY) === String(p.i) ? 'sel' : '') + '" data-a="by" data-v="' + p.i + '">' + esc(p.n) + '</button>'; };
        h += '<div class="sheet-bg" data-a="koCancel"></div><div class="sheet"><h2 class="disp">' + esc(pk.n) + ' sort</h2><div class="muted">Qui l’a éliminé ?</div><div class="grid">' + same.map(b).join('') + '</div>' + (others.length ? '<details><summary class="muted">Autres tables</summary><div class="grid">' + others.map(b).join('') + '</div></details>' : '') +
          '<div class="grid"><button data-a="koCancel">Annuler</button><button class="gold" data-a="koOk">' + (BY === '' ? 'Valider sans éliminateur' : 'Valider') + '</button></div></div>';
      }
    }
    app.innerHTML = h; dot();
    if (keepQ) { var q = document.getElementById('q'); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (e) {} } }
    window.scrollTo(0, y);
  }
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-a]'); if (!t) return;
    var a = t.getAttribute('data-a'), v = t.getAttribute('data-v');
    if (a === 'code') { var c = (document.getElementById('cd').value || '').replace(/\D/g, ''); if (c.length >= 4) { code = c; S = null; render(); poll(); } return; }
    if (a === 'tab') { TAB = v; render(); return; }
    if (a === 'ko') { KO = +v; BY = ''; render(); return; }
    if (a === 'by') { BY = BY === v ? '' : v; render(); return; }
    if (a === 'koCancel') { if (e.target === t || t.tagName === 'BUTTON') { KO = null; render(); } return; }
    if (a === 'koOk') { send({ a: 'ko', i: KO, by: BY }); KO = null; BY = ''; Q = ''; render(); return; }
    if ((a === 'unko' || a === 'reentry') && !confirm(a === 'unko' ? 'Annuler cette élimination ?' : 'Enregistrer une re-entry ?')) return;
    send(v !== null ? { a: a, i: +v } : { a: a });
  });
  document.addEventListener('input', function (e) { if (e.target.id === 'q') { Q = e.target.value; render(); } });
  setInterval(function () { var c = document.getElementById('clk'); if (c && S) { var r = rem(); c.textContent = mmss(r); c.classList.toggle('hot', S.run && r <= 60); } }, 250);
  setInterval(poll, 1000); render(); poll();
})();
</script>
</body>
</html>
